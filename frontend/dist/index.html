<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Serath — COD Operations Dashboard & AI Creative Production Platform" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Serath Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap"
    rel="stylesheet" />
  <!-- PWA Splash Screen (visible while JS loads) -->
  <style>
    .splash { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:99999; transition:opacity 0.3s; }
    .splash-inner { text-align:center; }
    .splash-logo { width:64px; height:64px; background:var(--accent,#00f0ff); border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:28px; font-weight:700; color:#000; box-shadow:0 0 30px rgba(0,240,255,0.4); }
    .splash-text { font-family:'Sora',sans-serif; font-size:18px; color:#F0F0F0; letter-spacing:-0.02em; }
    .splash-sub { font-family:'Inter',sans-serif; font-size:12px; color:#909090; margin-top:8px; }
  </style>
  <script type="module" crossorigin src="/assets/index-Ctyv0Phn.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C33UyPLu.css">
</head>

<body>
  <!-- Splash Screen -->
  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-logo">S</div>
      <div class="splash-text">Serath<span style="color:#00f0ff;font-weight:300">COD</span></div>
      <div class="splash-sub">Every thread tells a story</div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    // Hide splash when React mounts
    window.addEventListener('load',function(){
      setTimeout(function(){
        var s=document.getElementById('splash');
        if(s){s.style.opacity='0';setTimeout(function(){s.remove()},300)}
      },500)
    });
  </script>
</body>

</html>
